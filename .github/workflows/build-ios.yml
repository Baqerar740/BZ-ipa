name: Build iOS IPA

on:
  push:
    branches: [ main, master ]
  workflow_dispatch:

jobs:
  build:
    runs-on: macos-latest
    steps:
      - uses: actions/checkout@v4

      - name: Set up Node.js
        uses: actions/setup-node@v4
        with:
          node-version: 22

      - name: Install Dependencies
        run: npm install --legacy-peer-deps

      - name: Ensure Dist Directory
        run: |
          mkdir -p dist www
          cp -r src/* dist/ 2>/dev/null || true
          cp -r src/* www/ 2>/dev/null || true
          cp *.html *.js *.json dist/ 2>/dev/null || true
          cp *.html *.js *.json www/ 2>/dev/null || true

      - name: Sync Capacitor iOS
        run: npx cap sync ios

      - name: Build Xcode Workspace
        run: |
          cd ios/App
          xcodebuild -workspace App.xcworkspace -scheme App -configuration Release -derivedDataPath build -sdk iphoneos CODE_SIGNING_ALLOWED=NO CODE_SIGNING_REQUIRED=NO build

      - name: Create IPA Package
        run: |
          mkdir -p Payload
          cp -r ios/App/build/Build/Products/Release-iphoneos/*.app Payload/
          zip -r BaqezUGames.ipa Payload

      - name: Upload IPA Artifact
        uses: actions/upload-artifact@v4
        with:
          name: ios-ipa
          path: BaqezUGames.ipa
